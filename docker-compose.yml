services:
  postgres:
    image: postgres:16-alpine
    container_name: bugboard-db
    environment:
      POSTGRES_DB: bugboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bugboard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: bugboard-backend
    environment:
      DB_HOST: postgres
      DB_NAME: bugboard
      DB_USER: postgres
      DB_PASSWORD: postgres
      BUGBOARD_ATTACHMENTS_DIR: /opt/payara/uploads/attachments
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-dev-local-secret-change-me}
      AUTH_ACCESS_TOKEN_TTL_MINUTES: ${AUTH_ACCESS_TOKEN_TTL_MINUTES:-480}
    ports:
      - "8080:8080"
      - "4848:4848"
    volumes:
      - ./backend/uploads:/opt/payara/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bugboard-network

  frontend:
    build: ./frontend
    container_name: bugboard-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - bugboard-network

  sonarqube:
    image: sonarqube:9.9.4-community
    container_name: bugboard-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres_sonar:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - bugboard-network
    depends_on:
      postgres_sonar:
        condition: service_healthy

  sonar-scanner:
    image: maven:3.9-eclipse-temurin-17
    container_name: bugboard-sonar-scanner
    working_dir: /workspace/backend
    environment:
      SONAR_TOKEN: ${SONAR_TOKEN:-__MISSING_SONAR_TOKEN__}
    volumes:
      - ./backend:/workspace/backend
      - maven_repo:/root/.m2
    depends_on:
      - sonarqube
    networks:
      - bugboard-network
    command: >
      /bin/sh -lc '
      set -e;
      echo "Waiting for SonarQube to be ready...";
      until curl -sSf "http://sonarqube:9000/api/system/status" | grep -q "\"status\":\"UP\""; do
        sleep 5;
      done;
      if [ "$$SONAR_TOKEN" = "__MISSING_SONAR_TOKEN__" ]; then
        echo "SONAR_TOKEN is missing. Set SONAR_TOKEN in your .env file.";
        exit 1;
      fi;
      mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
        -Dsonar.host.url=http://sonarqube:9000 \
        -Dsonar.projectKey=bugboard-backend \
        -Dsonar.projectName=bugboard-backend \
        -Dsonar.token=$$SONAR_TOKEN;
      '

  postgres_sonar:
    image: postgres:15-alpine
    container_name: bugboard-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - postgres_sonar_data:/var/lib/postgresql/data
    networks:
      - bugboard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  bugboard-network:
    driver: bridge

volumes:
  postgres_data:
  postgres_sonar_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  maven_repo:
